# Everything runs on Netlify: the page is served from public/ and the game
# itself runs in netlify/functions/game.mjs, with rooms stored in Netlify Blobs.
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# letterblitz.world is the site's address. Send visitors of the old Netlify
# address there, keeping the path and any invite code (?room=ABCD).
[[redirects]]
  from = "https://letterblitz.netlify.app/*"
  to = "https://letterblitz.world/:splat"
  status = 301
  force = true

# Security headers for every page.
# - Content-Security-Policy: only this site's own scripts may run; fonts come
#   from Google Fonts; nothing may embed the site in a frame (clickjacking).
# - The rest turn off browser features the game never uses and stop
#   content-type guessing, referrer leaks and downgrade to plain HTTP.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Cross-Origin-Opener-Policy = "same-origin"
